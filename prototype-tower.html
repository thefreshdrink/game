<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tower — прототип дженги</title>
<!--
  ОДНОРАЗОВЫЙ ПРОТОТИП. Не часть сборки, не импортируется игрой.
  Изометрия 2:1 — по решению в чате: только под углом кладка крест-накрест
  читается как дженга, в лоб выходила кирпичная стена.
  Арта нет намеренно: блоки собраны гранями палитры, чтобы щупать темп.
-->
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;touch-action:none}
</style>
<canvas id="c" width="430" height="932"></canvas>
<script>
const C=document.getElementById('c'), ctx=C.getContext('2d');
ctx.imageSmoothingEnabled=false;

// ── палитра проекта ───────────────────────────────────────────────────────
const AIR='#111111', BODY='#000000', LINE='#FFFFFF', LINE2='#B8B8B8',
      TEX='#808080', FAR='#4A4A4A', UI='#232323', ACCENT='#EBA331';

// ── изометрия 2:1, всё в чётных пикселях ──────────────────────────────────
// Мир в единицах бруска: короткая сторона 1, длинная 3, высота ряда 1.
const U=26, HU=13, ZH=20;            // шаг вправо / вниз / высота ряда
const ROWS=12, COLS=3;               // 12 рядов по 3 бруска = 36 вынимаемых
const OX=C.width/2, OY=600;          // где стоит основание
const PULL_TIME=0.8, PULL_DIST=2.6;  // сек удержания, вылет в единицах

function P(x,y,z){ return [OX+(x-y)*U, OY+(x+y)*HU-z*ZH]; }

let rows, debris, dust, phase, tPhase, shake, pulling, pivotRow, crown, frames=0, lastT;

// Чётный ряд: три бруска лежат вдоль X и стоят рядом по Y. Нечётный — наоборот.
function cellsOf(r){
  const out=[];
  for(let i=0;i<COLS;i++) out.push(r%2===0 ? {x:0,y:i,dx:3,dy:1} : {x:i,y:0,dx:1,dy:3});
  return out;
}

function reset(){
  rows=[];
  for(let r=0;r<ROWS;r++){
    // пара брусков изначально чуть выдвинута: ровная кладка читается кирпичом
    rows.push({ r, slots:[1,1,1], lean:0, leanTo:0,
      jitter:[0,1,2].map(()=>Math.random()<0.3?0.10+Math.random()*0.12:0) });
  }
  debris=[]; dust=[]; if(typeof taken!=='undefined') taken.clear(); phase='play'; tPhase=0; shake=0; pulling=null; pivotRow=-1;
  crown={x:1.5,y:1.5,z:ROWS,vx:0,vy:0,vz:0,live:false,rest:false};
}

// Просадка рядов ниже сдвигает всё, что выше, поперёк своего ряда.
function shiftAt(r){
  let sx=0, sy=0;
  for(let i=0;i<r;i++){ if(i%2===0) sy+=rows[i].lean; else sx+=rows[i].lean; }
  return [sx,sy];
}

function cellPos(r,i){
  const c=cellsOf(r)[i], [sx,sy]=shiftAt(r);
  const out=(pulling && pulling.r===r && pulling.i===i) ? pulling.out : 0;
  const push=out+rows[r].jitter[i];
  return { x:c.x+sx+(r%2===0?push:0), y:c.y+sy+(r%2===0?0:push), z:r, dx:c.dx, dy:c.dy };
}

// ── устойчивость ──────────────────────────────────────────────────────────
// Два бруска в ряду держат; один — ряд проседает на его сторону; башня падает,
// когда центр тяжести верха уходит за опору ряда.
function updateStability(){
  for(const row of rows){
    const n=row.slots.filter(Boolean).length;
    const side=row.slots.reduce((a,v,i)=>a+(v?[-1,0,1][i]:0),0);
    row.leanTo = n>=2 ? 0 : (n===1 ? side*0.5 : 0);
  }
  for(let r=0;r<ROWS;r++){
    const kept=rows[r].slots.map((v,i)=>v?i:-1).filter(i=>i>=0);
    if(!kept.length) return r;
    let mass=0,mx=0,my=0;
    for(let q=r+1;q<ROWS;q++) rows[q].slots.forEach((v,i)=>{
      if(!v) return; const p=cellPos(q,i); mass++; mx+=p.x+p.dx/2; my+=p.y+p.dy/2;
    });
    if(!mass) continue;
    const com = r%2===0 ? my/mass : mx/mass;
    const [sx,sy]=shiftAt(r), base = r%2===0 ? sy : sx;
    if(com < base+Math.min(...kept)-0.35 || com > base+Math.max(...kept)+1.35) return r;
  }
  return -1;
}

const blocksLeft=()=>rows.reduce((a,r)=>a+r.slots.filter(Boolean).length,0);
const tension=()=>Math.min(1,(COLS*ROWS-blocksLeft())/16 + rows.reduce((a,r)=>a+Math.abs(r.lean),0)/3);

// ── рисование ─────────────────────────────────────────────────────────────
function poly(pts,fill){ ctx.fillStyle=fill; ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); }
function line(a,b,color,w){ ctx.strokeStyle=color; ctx.lineWidth=w||2; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }

function facesOf(o){
  const {x,y,z,dx,dy}=o, x1=x+dx, y1=y+dy, z1=z+1;
  return {
    top:  [P(x,y,z1), P(x1,y,z1), P(x1,y1,z1), P(x,y1,z1)],
    right:[P(x1,y,z1), P(x1,y1,z1), P(x1,y1,z), P(x1,y,z)],
    front:[P(x,y1,z1), P(x1,y1,z1), P(x1,y1,z), P(x,y1,z)],
  };
}

function drawBlock(o,hot){
  const f=facesOf(o);
  poly(f.top, FAR);        // верх светлее всего — по нему читается глубина
  poly(f.front, UI);
  poly(f.right, BODY);
  const cx=(f.top[0][0]+f.top[2][0])/2, cy=(f.top[0][1]+f.top[2][1])/2;
  ctx.fillStyle=TEX; ctx.fillRect(Math.round(cx-6),Math.round(cy),2,2); ctx.fillRect(Math.round(cx+4),Math.round(cy-4),2,2);
  const L=hot?ACCENT:LINE, L2=hot?ACCENT:LINE2;
  line(f.top[0],f.top[1],L2); line(f.top[1],f.top[2],L); line(f.top[2],f.top[3],L); line(f.top[3],f.top[0],L2);
  line(f.right[1],f.right[2],L); line(f.right[2],f.right[3],L);
  line(f.front[2],f.front[3],L); line(f.front[3],f.front[0],L2);
}

function drawGround(){
  for(let gx=-3;gx<=6;gx++) for(let gy=-3;gy<=6;gy++){
    const q=[P(gx,gy,0),P(gx+1,gy,0),P(gx+1,gy+1,0),P(gx,gy+1,0)];
    poly(q,(gx+gy)%2?UI:'#1C1C1C');
    line(q[0],q[1],FAR,1); line(q[0],q[3],FAR,1);
  }
}

function drawCrown(x,y,z){
  const [sx,sy]=P(x,y,z);
  ctx.fillStyle=LINE;
  ctx.fillRect(Math.round(sx-16),Math.round(sy-6),32,8);
  [-16,-4,8].forEach(dx=>ctx.fillRect(Math.round(sx+dx),Math.round(sy-16),8,12));
  ctx.fillStyle=LINE2; ctx.fillRect(Math.round(sx-16),Math.round(sy+2),32,2);
}

function drawEdgeDark(k){
  if(k<=0) return;
  const band=Math.round(110*k/2)*2, ramp=['#161616','#1C1C1C','#212121','#252525','#2A2A2A','#2E2E2E'];
  for(let s=5;s>=0;s--){
    const w=Math.round(band*(s+1)/6/2)*2;
    ctx.fillStyle=ramp[s];
    ctx.fillRect(0,0,w,C.height); ctx.fillRect(C.width-w,0,w,C.height);
    ctx.fillRect(0,0,C.width,Math.round(w*0.7)); ctx.fillRect(0,C.height-Math.round(w*0.7),C.width,Math.round(w*0.7));
  }
}

// ── ввод ──────────────────────────────────────────────────────────────────
function inPoly(p,pts){
  let hit=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i], [xj,yj]=pts[j];
    if((yi>p[1])!==(yj>p[1]) && p[0] < (xj-xi)*(p[1]-yi)/(yj-yi)+xi) hit=!hit;
  }
  return hit;
}
function pick(px,py){
  let found=null;                       // ближний к зрителю выигрывает
  for(let r=0;r<ROWS;r++) rows[r].slots.forEach((v,i)=>{
    if(!v) return;
    const o=cellPos(r,i), f=facesOf(o);
    if(inPoly([px,py],f.top)||inPoly([px,py],f.front)||inPoly([px,py],f.right)){
      const depth=(o.x+o.y)+r*0.01;
      if(!found||depth>found.depth) found={r,i,depth};
    }
  });
  return found;
}
function toCanvas(e){ const R=C.getBoundingClientRect(); return [(e.clientX-R.left)*C.width/R.width,(e.clientY-R.top)*C.height/R.height]; }
C.addEventListener('pointerdown',e=>{
  const [x,y]=toCanvas(e);
  if(phase==='done'){ reset(); return; }
  if(phase!=='play') return;
  const hit=pick(x,y);
  if(hit) pulling={r:hit.r,i:hit.i,t:0,out:0};
});
C.addEventListener('pointerup',()=>{ if(pulling) pulling.releasing=true; });
C.addEventListener('pointercancel',()=>{ if(pulling) pulling.releasing=true; });

// ── шаг ───────────────────────────────────────────────────────────────────
function step(dt){
  tPhase+=dt;

  if(pulling){
    if(pulling.releasing){
      pulling.out-=dt*6;
      if(pulling.out<=0) pulling=null;
    }else{
      pulling.t+=dt;
      pulling.out=Math.min(PULL_DIST,(pulling.t/PULL_TIME)*PULL_DIST);
      if(pulling.t>=PULL_TIME){
        const o=cellPos(pulling.r,pulling.i);
        rows[pulling.r].slots[pulling.i]=0;
        debris.push({...o, vx:o.dx===3?2.4:0.7, vy:o.dy===3?2.4:0.7, vz:0.5, rest:false});
        puff(o); pulling=null;
      }
    }
  }

  rows.forEach(r=>{ r.lean += (r.leanTo-r.lean)*Math.min(1,dt*4); });

  if(phase==='play'){
    shake=tension()*3;
    const p=updateStability();
    if(p>=0){ pivotRow=p; startCollapse(); }
  }
  if(phase==='fall'){
    shake=0;                                   // дрожь обрывается в кадр отрыва
    if(debris.every(d=>d.rest)&&crown.rest&&tPhase>2){ phase='rest'; tPhase=0; }
  }
  stepDebris(dt, phase==='fall'?0.55:1);
  if(phase==='rest'&&tPhase>2.4){ phase='done'; tPhase=0; }
  dust=dust.filter(d=>{ d.t+=dt; d.sx+=d.vx*dt; d.sy+=d.vy*dt; d.vy+=50*dt; return d.t<d.life; });
}

function startCollapse(){
  phase='fall'; tPhase=0;
  const dir=rows[pivotRow].lean<=0?-1:1;
  for(let r=0;r<ROWS;r++) rows[r].slots.forEach((v,i)=>{
    if(!v) return;
    const o=cellPos(r,i), lever=Math.max(0.1,(r-pivotRow))*0.16+0.3;
    debris.push({...o,
      vx:(r%2===0?dir*lever*0.7:dir*lever*1.1)+(Math.random()-0.5)*1.4,
      vy:(r%2===0?dir*lever*1.1:dir*lever*0.7)+(Math.random()-0.5)*1.4,
      vz:0.6+Math.random()*1.0, rest:false,
      ...(Math.random()<0.45 ? {dx:o.dy, dy:o.dx} : {})});
    rows[r].slots[i]=0; puff(o);
  });
  crown.live=true; crown.vx=dir*1.1; crown.vy=dir*1.1; crown.vz=2.4;
}

// Земля занята посекционно: куски расходятся, а не падают один в другой.
const taken=new Set();
function cells(d){
  const out=[];
  for(let a=0;a<Math.round(d.dx);a++) for(let b=0;b<Math.round(d.dy);b++)
    out.push(`${Math.round(d.x)+a},${Math.round(d.y)+b},${Math.round(d.z)}`);
  return out;
}
function settle(d){
  const cx=1.5, cy=1.5;
  for(let tries=0;tries<40;tries++){
    if(cells(d).every(k=>!taken.has(k))){ cells(d).forEach(k=>taken.add(k)); return; }
    const ax=d.x+d.dx/2-cx, ay=d.y+d.dy/2-cy;      // толкаем наружу от центра,
    const along = Math.random()<0.65                // но не строго по одной оси
      ? Math.abs(ax)>Math.abs(ay) : Math.random()<0.5;
    if(along) d.x+=Math.sign(ax)||(Math.random()<0.5?1:-1);
    else      d.y+=Math.sign(ay)||(Math.random()<0.5?1:-1);
    if(tries===6) d.z=1;                            // тесно — ложится вторым слоем
    if(tries===16) d.z=2;
    if(tries===26) d.z=0;
  }
  cells(d).forEach(k=>taken.add(k));
}

function stepDebris(dt,slow){
  const d2=dt*slow;
  for(const d of debris){
    if(d.rest) continue;
    d.vz-=26*d2; d.x+=d.vx*d2; d.y+=d.vy*d2; d.z+=d.vz*d2;
    d.vx*=(1-1.4*d2); d.vy*=(1-1.4*d2);
    if(d.z<=0){
      d.z=0;
      if(Math.abs(d.vz)<3){ d.rest=true; d.vx=d.vy=d.vz=0; d.x=Math.round(d.x); d.y=Math.round(d.y); settle(d); }
      else { d.vz*=-0.24; d.vx*=0.4; d.vy*=0.4; puff(d); }
    }
  }
  if(crown.live&&!crown.rest){
    crown.vz-=26*d2; crown.x+=crown.vx*d2; crown.y+=crown.vy*d2; crown.z+=crown.vz*d2;
    if(crown.z<=0.2){ crown.z=0.2; if(Math.abs(crown.vz)<3){ crown.rest=true; crown.vx=crown.vy=0; } else { crown.vz*=-0.3; crown.vx*=0.6; crown.vy*=0.6; } }
  }
}

function puff(o){
  const [sx,sy]=P(o.x+(o.dx||1)/2,o.y+(o.dy||1)/2,o.z+0.5);
  for(let k=0;k<6;k++) dust.push({sx,sy,vx:(Math.random()*2-1)*40,vy:-Math.random()*30,t:0,life:0.5+Math.random()*0.5,s:Math.random()<0.5?2:4});
}

// ── кадр ──────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle=AIR; ctx.fillRect(0,0,C.width,C.height);
  drawEdgeDark(phase==='play'?tension()*0.3:0.12);

  ctx.save();
  if(shake) ctx.translate(Math.round((Math.random()*2-1)*shake),Math.round((Math.random()*2-1)*shake));

  drawGround();
  debris.filter(d=>d.rest).sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(d=>drawBlock(d,false));

  for(let r=0;r<ROWS;r++){
    const list=[];
    rows[r].slots.forEach((v,i)=>{ if(v) list.push({o:cellPos(r,i), hot:!!(pulling&&pulling.r===r&&pulling.i===i)}); });
    list.sort((a,b)=>(a.o.x+a.o.y)-(b.o.x+b.o.y));
    list.forEach(e=>drawBlock(e.o,e.hot));
  }

  if(!crown.live){ if(blocksLeft()) drawCrown(1.5,1.5,ROWS); }
  else drawCrown(crown.x,crown.y,crown.z);

  debris.filter(d=>!d.rest).sort((a,b)=>a.z-b.z).forEach(d=>drawBlock(d,false));
  dust.forEach(d=>{ ctx.fillStyle=d.t/d.life<0.5?LINE2:TEX; ctx.fillRect(Math.round(d.sx),Math.round(d.sy),d.s,d.s); });
  ctx.restore();

  ctx.fillStyle=LINE; ctx.font='16px monospace'; ctx.textAlign='center';
  if(phase==='play'){
    ctx.globalAlpha=0.6;
    ctx.fillText(blocksLeft()===COLS*ROWS?'HOLD A BLOCK':`${blocksLeft()} BLOCKS HOLD IT`, C.width/2, 60);
    ctx.globalAlpha=1;
  }else if(phase==='rest'||phase==='done'){
    ctx.fillText('IT HAD TO FALL', C.width/2, 60);
    if(phase==='done'){ ctx.globalAlpha=0.6; ctx.fillText('tap to try again', C.width/2, 90); ctx.globalAlpha=1; }
  }
}

function loop(now){
  frames++;
  const dt=Math.min(0.05,(now-(lastT||now))/1000); lastT=now;
  step(dt); draw(); requestAnimationFrame(loop);
}
function fit(){ const k=Math.min(innerWidth/C.width,innerHeight/C.height); C.style.width=Math.floor(C.width*k)+'px'; C.style.height=Math.floor(C.height*k)+'px'; }
addEventListener('resize',fit); fit(); reset(); requestAnimationFrame(loop);

window.towerReset=reset;
window.towerState=()=>({phase,left:blocksLeft(),pivot:pivotRow,debris:debris.length,frames,pulling:pulling&&{r:pulling.r,i:pulling.i}});
</script>
